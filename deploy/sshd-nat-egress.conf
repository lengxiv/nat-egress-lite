# 日本 VPS：确认主配置 Include /etc/ssh/sshd_config.d/*.conf 后安装此片段。
# 不修改主 SSH 监听端口；使用现有 SSH 服务。修改后先 sshd -t 和 -T 核验，再 reload。
Match User nat-tunnel
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:19080
    PermitOpen none
    GatewayPorts no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 0
    ClientAliveInterval 20
    ClientAliveCountMax 3
Match all
